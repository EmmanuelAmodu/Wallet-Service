services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_local_only
      POSTGRES_DB: wallet
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 5s
      timeout: 3s
      retries: 10
  broadcast-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: broadcast
      POSTGRES_PASSWORD: broadcast_local_only
      POSTGRES_DB: broadcast
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - broadcast-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broadcast -d broadcast']
      interval: 5s
      timeout: 3s
      retries: 10
  ledger-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_local_only
      POSTGRES_DB: ledger
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 5s
      timeout: 3s
      retries: 10
  activity-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: activity
      POSTGRES_PASSWORD: activity_local_only
      POSTGRES_DB: activity
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - activity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U activity -d activity']
      interval: 5s
      timeout: 3s
      retries: 10
  sweep-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sweep
      POSTGRES_PASSWORD: sweep_local_only
      POSTGRES_DB: sweep
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - sweep-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sweep -d sweep']
      interval: 5s
      timeout: 3s
      retries: 10
  user-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users_local_only
      POSTGRES_DB: users
    ports:
      - '127.0.0.1:5437:5432'
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U users -d users']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'always',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  pubsub:
    image: google/cloud-sdk:emulators
    command:
      [
        'gcloud',
        'beta',
        'emulators',
        'pubsub',
        'start',
        '--host-port=0.0.0.0:8086',
        '--project=wallet-local',
      ]
    ports:
      - '127.0.0.1:8086:8086'
volumes:
  postgres-data:
  broadcast-postgres-data:
  ledger-postgres-data:
  activity-postgres-data:
  sweep-postgres-data:
  user-postgres-data:
  redis-data:
