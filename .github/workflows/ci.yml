name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: wallet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      broadcast-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: broadcast
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: broadcast_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U broadcast -d broadcast_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_BROADCAST_DATABASE_URL: postgresql://broadcast:test-only@localhost:5433/broadcast_test
      TEST_REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://wallet:test-only@localhost:5432/wallet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
